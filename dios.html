    <style>
        body {
            margin: 0;

            height: 100vh;
            overflow: hidden;
            transition: background 0.3s;
        }

        .fondo-juego-activo { background: black !important; background-image: none !important; }

        .contenedor-opciones { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
        .tarjeta { background: rgba(0,0,0,0.8); padding: 20px; border-radius: 15px; width: 250px; cursor: pointer; border: 2px solid #00ccff; transition: 0.3s; }
        .tarjeta:hover { border-color: #ff0077; transform: scale(1.05); }
        .img-menu { width: 100%; max-height: 180px; object-fit: contain; border-radius: 10px; margin-top: 15px; display: block; }

        /* --- AREAS DE JUEGO --- */
        #game-area {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 100%; height: 500px;
            z-index: 1;
            display: flex; justify-content: center; align-items: center;
            pointer-events: none;
        }

        /* DISEÑO DDR (Coreografía) */
        .pista-baile {
            position: relative;
            width: 450px; height: 100vh;
            background: rgba(255,255,255,0.05);
            display: none; justify-content: center;
        }
        .zona-receptores { position: absolute; top: 50px; display: flex; gap: 20px; }
        .receptor { width: 70px; height: 70px; border: 2px solid rgba(255,255,255,0.3); border-radius: 10px; font-size: 40px; display: flex; justify-content: center; align-items: center; }
        .receptor.activo {
    background: #00ccff;
    box-shadow: 0 0 20px #00ccff, 0 0 40px #00ccff;
    transform: scale(1.2);
    transition: 0.1s;
}
        
        .flecha-nota {
            position: absolute;
            font-size: 60px;
            animation: subirNota 3s linear forwards;
        }
        @keyframes subirNota {
            0% { top: 100vh; opacity: 0; }
            10% { opacity: 1; }
            100% { top: 50px; opacity: 0; }
        }

        /* DISEÑO CAÍDA (Aleatorio) */
        .flecha-caida {
            position: absolute;
            width: 100%;
            font-size: 110px; 
            font-weight: bold;
            -webkit-text-stroke: 2px black;
            text-shadow: 0 0 20px rgba(0,0,0,1);
            animation: caer var(--duracion, 2.8s) linear forwards; 
        }

        @keyframes caer {
            0% { top: -200px; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 400px; opacity: 0; }
        }

        .circulo-color { 
    width: 220px; 
    height: 220px; 
    border-radius: 50%; 
    border: 5px solid white; 
    display: block;
    margin: 0 auto;
}

        /* --- CONTROLES --- */
        .btn-ctrl, .btn-motivate { padding: 15px 25px; border-radius: 10px; font-weight: bold; color: white; border: none; cursor: pointer; margin: 5px; min-width: 110px; z-index: 20; }
        .btn-motivate { background: #ff0077; }
        .contenedor-controles { position: relative; z-index: 10; margin-top: 400px; }
        .controles-velocidad { display: flex; gap: 10px; margin-top: 10px; justify-content: center; }

       .mensaje-motivador {

   @keyframes aparecerMensaje {

    0%{
        opacity:0;
        transform: translateY(30px);
    }

    15%{
        opacity:1;
        transform: translateY(0px);
    }

    85%{
        opacity:1;
        transform: translateY(0px);
    }

    100%{
        opacity:0;
        transform: translateY(-20px);
    }
}     
       
</style>

    function generarPatron(pasos, reps, esp) {
        let f = [];
        for(let i=0; i<reps; i++) { pasos.forEach(p => f.push({ t: p.t + (i * esp), n: p.n })); }
        return f;
    }
   function unirPatrones(...patrones){
    let tiempo = 0;
    let resultado = [];

    patrones.forEach(p => {
        p.forEach(nota => {
            resultado.push({
                t: nota.t + tiempo,
                n: nota.n
            });
        });
        tiempo = resultado[resultado.length - 1].t;
    });

    return resultado;
}

    function repetirCiclo(ciclo, veces){
    let resultado = [];
    let duracion = ciclo[ciclo.length - 1].t;

    for(let i=0; i<veces; i++){
        ciclo.forEach(nota => {
            resultado.push({
                t: nota.t + (i * duracion),
                n: nota.n
            });
        });
    }

    return resultado;
}

    function mezclarArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
}

    }

else{

      function iniciarCiclo(){

    let ms = Math.max(600, 2800 + ajusteManualVelocidad);

    intervalo = setInterval(() => {

        // reiniciar secuencia
        if(indiceSecuencia >= secuenciaActual.length){
            indiceSecuencia = 0;
        }

        // obtener paso actual
        const paso = secuenciaActual[indiceSecuencia];

        indiceSecuencia++;

        if(Math.random() < 0.40){
            mensajePorCiclo();
        }

        const area = document.getElementById("game-area");

        const div = document.createElement("div");

        div.className = "flecha-caida";

        div.style.setProperty('--duracion', (ms/1000) + 's');

        // --- VISUALES ---
        
        // colores
        if(
            paso.v.includes("rojo") ||
            paso.v.includes("verde") ||
            paso.v.includes("amarillo") ||
            paso.v.includes("morado")
        ){

           div.innerHTML = `
    <div class="circulo-color" style="background:${paso.c}"></div>

    <div style="
        font-size:32px;
        margin-top:20px;
        color:white;
        text-shadow:0 0 10px black;
    ">
        ${paso.s}
    </div>
`;

        }

        // flechas adelante/atrás/derecha/izquierda
        else{

            let flecha = "⬆️";

            if(paso.v.includes("atrás")){
                flecha = "⬇️";
            }

            if(paso.v.includes("derecha")){
                flecha = "➡️";
            }

            if(paso.v.includes("izquierda")){
                flecha = "⬅️";
            }

            div.innerHTML = `
    <div>${flecha}</div>
    <div style="
        font-size:32px;
        margin-top:10px;
        color:white;
        text-shadow:0 0 10px black;
    ">
        ${paso.s}
    </div>
`;

            div.style.color = paso.c;
        }

        area.appendChild(div);

        hablar(paso.v);

        setTimeout(() => div.remove(), ms);

    }, ms);
}
            

    function bucleCoreo() {
    if (modo !== "coreo") return;

    const audio = document.getElementById("music");
    let cur = audio.currentTime;
    // mensajes durante la canción
if(cur - ultimoMensajeCoreo >= 12){

    ultimoMensajeCoreo = cur;

    mensajePorCiclo();
}

    if (notasCoreoRestantes.length > 0 && cur >= tiempoInicioPatron + (notasCoreoRestantes[0].t / velocidadCoreo)){
        crearFlechaDDR(notasCoreoRestantes[0].n);
        notasCoreoRestantes.shift();
    }

    // 🔁 cuando se acaban, reinicia SOLO el patrón
if (notasCoreoRestantes.length === 0) {

    if(!window.repeticionesCiclo) window.repeticionesCiclo = 0;
    window.repeticionesCiclo++;
    
    mensajePorCiclo();

    // 🔥 PROGRESIVO SUAVE
    velocidadCoreo = Math.min(1.3, 0.7 + (window.repeticionesCiclo * 0.15));

    const audio = document.getElementById("music");
    audio.playbackRate = velocidadCoreo;

    const mapaActual = Object.values(mapas).find(m => 
        m.archivo === audio.src.split('/').pop()
    );

    if (mapaActual) {
        tiempoInicioPatron = cur;
        notasCoreoRestantes = mapaActual.pasos.map(p => ({ t: p.t, n: p.n }));
    }
}

rafCoreo = requestAnimationFrame(bucleCoreo);
}
    function crearFlechaDDR(dir) {
        const div = document.createElement("div");
        div.className = "flecha-nota";
        const config = { 'IZQ': {i:'⬅️', l:'10px'}, 'ARR': {i:'⬆️', l:'115px'}, 'ABJ': {i:'⬇️', l:'220px'}, 'DER': {i:'➡️', l:'325px'} };
        div.style.left = config[dir].l;
        div.innerHTML = config[dir].i;
        document.getElementById("notas-ddr").appendChild(div);
        const indexMap = { 'IZQ': 0, 'ARR': 1, 'ABJ': 2, 'DER': 3 };
const receptores = document.querySelectorAll(".receptor");
const receptor = receptores[indexMap[dir]];

if(receptor){
    receptor.classList.add("activo");
    setTimeout(() => receptor.classList.remove("activo"), 300);
}
        setTimeout(() => div.remove(), 3100);
    }

    function detenerJuego(){
        clearInterval(intervalo);
        cancelAnimationFrame(rafCoreo);
        document.getElementById("music").pause();
        window.speechSynthesis.cancel();
    }

    function pararTodo(){
        detenerJuego();
        document.getElementById("game-area").innerHTML = "";
        document.getElementById("notas-ddr").innerHTML = "";
    }

    function irAMenu(){ 
        pararTodo(); 
        document.body.classList.remove('fondo-juego-activo');
        mostrarPantalla('pantalla-menu'); 
    }
</script>
