<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Un Paso a la Vez - NeuroDance</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            text-align: center;
            color: white;
            background-image: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('fondo.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            height: 100vh;
            overflow: hidden;
            transition: background 0.3s;
        }

        .fondo-juego-activo { background: black !important; background-image: none !important; }
        .pantalla { display: none; height: 100vh; flex-direction: column; justify-content: center; align-items: center; }
        .activa { display: flex; }
        .titulo-neon { font-size: 5rem; text-shadow: 0 0 10px #ff0077, 0 0 20px #ff0077; margin-bottom: 20px; }
        .contenedor-opciones { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
        .tarjeta { background: rgba(0,0,0,0.8); padding: 20px; border-radius: 15px; width: 250px; cursor: pointer; border: 2px solid #00ccff; transition: 0.3s; }
        .tarjeta:hover { border-color: #ff0077; transform: scale(1.05); }
        .img-menu { width: 100%; max-height: 180px; object-fit: contain; border-radius: 10px; margin-top: 15px; display: block; }

        /* --- AREAS DE JUEGO --- */
        #game-area {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 100%; height: 500px;
            z-index: 1;
            display: flex; justify-content: center; align-items: center;
            pointer-events: none;
        }

        /* DISEÑO DDR (Coreografía) */
        .pista-baile {
            position: relative;
            width: 450px; height: 100vh;
            background: rgba(255,255,255,0.05);
            display: none; justify-content: center;
        }
        .zona-receptores { position: absolute; top: 50px; display: flex; gap: 20px; }
        .receptor { width: 70px; height: 70px; border: 2px solid rgba(255,255,255,0.3); border-radius: 10px; font-size: 40px; display: flex; justify-content: center; align-items: center; }
        .receptor.activo {
    background: #00ccff;
    box-shadow: 0 0 20px #00ccff, 0 0 40px #00ccff;
    transform: scale(1.2);
    transition: 0.1s;
}
        
        .flecha-nota {
            position: absolute;
            font-size: 60px;
            animation: subirNota 3s linear forwards;
        }
        @keyframes subirNota {
            0% { top: 100vh; opacity: 0; }
            10% { opacity: 1; }
            100% { top: 50px; opacity: 0; }
        }

        /* DISEÑO CAÍDA (Aleatorio) */
        .flecha-caida {
            position: absolute;
            width: 100%;
            font-size: 110px; 
            font-weight: bold;
            -webkit-text-stroke: 2px black;
            text-shadow: 0 0 20px rgba(0,0,0,1);
            animation: caer var(--duracion, 2.8s) linear forwards; 
        }

        @keyframes caer {
            0% { top: -200px; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 400px; opacity: 0; }
        }

        .circulo-color { 
    width: 220px; 
    height: 220px; 
    border-radius: 50%; 
    border: 5px solid white; 
    display: block;
    margin: 0 auto;
}

        /* --- CONTROLES --- */
        .btn-ctrl, .btn-motivate { padding: 15px 25px; border-radius: 10px; font-weight: bold; color: white; border: none; cursor: pointer; margin: 5px; min-width: 110px; z-index: 20; }
        .btn-motivate { background: #ff0077; }
        .contenedor-controles { position: relative; z-index: 10; margin-top: 400px; }
        .controles-velocidad { display: flex; gap: 10px; margin-top: 10px; justify-content: center; }

        .mensaje-motivador {
            position: absolute; background: rgba(255, 255, 255, 0.9); color: #333; padding: 15px 25px; border-radius: 20px; font-weight: bold; animation: subirMensaje 4s ease-out forwards; z-index: 50;
        }
        @keyframes subirMensaje { 0% { bottom: -50px; opacity: 0; } 100% { bottom: 80%; opacity: 0; } }
    </style>
</head>
<body>

    <div id="pantalla-bienvenida" class="pantalla activa">
        <h1 class="titulo-neon">UN PASO A LA VEZ</h1>
        <button class="btn-ctrl" style="background:#ff0077; font-size: 1.5rem;" onclick="mostrarPantalla('pantalla-menu')">COMENZAR</button>
    </div>

    <div id="pantalla-menu" class="pantalla">
        <h2 style="font-size: 2.5rem;">Selecciona el Modo</h2>
        <div class="contenedor-opciones">
            <div class="tarjeta" onclick="prepararAleatorio()">
                <h3>MODO ALEATORIO</h3>
                <img src="cuadro aleatorio.png" class="img-menu">
            </div>
            <div class="tarjeta" onclick="mostrarPantalla('pantalla-canciones')">
                <h3>MODO COREOGRAFÍA</h3>
                <img src="cuadro coreografia.png" class="img-menu">
            </div>
        </div>
    </div>

    <div id="pantalla-canciones" class="pantalla">
        <h2 style="font-size: 2.5rem;">Elige tu Canción</h2>
        <div class="contenedor-opciones">
            <div class="tarjeta" onclick="seleccionarCancion('cancion1')">Canción 1</div>
            <div class="tarjeta" onclick="seleccionarCancion('cancion2')">Canción 2</div>
            <div class="tarjeta" onclick="seleccionarCancion('cancion3')">Canción 3</div>
        </div>
        <button class="btn-ctrl" style="background:#444; margin-top:30px;" onclick="mostrarPantalla('pantalla-menu')">Volver</button>
    </div>

    <div id="pantalla-juego" class="pantalla">
        <div id="game-area"></div>
        <div id="pista-ddr" class="pista-baile">
            <div class="zona-receptores">
                <div class="receptor">⬅️</div><div class="receptor">⬆️</div><div class="receptor">⬇️</div><div class="receptor">➡️</div>
            </div>
            <div id="notas-ddr"></div>
        </div>
        
        <div class="contenedor-controles">
            <div>
               
                <button class="btn-ctrl" style="background: #2ecc71;" onclick="startGame()">INICIAR</button>
                <button class="btn-ctrl" style="background: #f1c40f; color: black;" onclick="detenerJuego()">DETENER</button>
                <button class="btn-ctrl" style="background: #e74c3c;" onclick="irAMenu()">SALIR</button>
                <button class="btn-ctrl" style="background:#555;" onclick="toggleVoz()" id="btn-voz">Quitar voz guía</button>

            </div>
            <div id="ctrl-velocidad-aleatorio" class="controles-velocidad">
                <button class="btn-ctrl" style="background: #3498db;" onclick="ajustarManual(200)">🐢 - Velocidad</button>
                <button class="btn-ctrl" style="background: #9b59b6;" onclick="ajustarManual(-200)">⚡ + Velocidad</button>
            </div>
        </div>
    </div>

    <audio id="music"></audio>

<script>
    let modo = "";
    let intervalo;
    let rafCoreo;
    let ajusteManualVelocidad = 0;
    let mazoComandos = [];
    let notasCoreoRestantes = [];
    let tiempoInicioPatron = 0;
    let vozActiva = true;

    const frasesMotivadoras = ["¡Exacto, sigue así!", "¡Cada paso cuenta!", "¡Vas muy bien!", "¡Casi lo tienes!"];

    // COMANDOS ALEATORIOS (LOS 12 COMPLETOS)
    const comandosAleatorios = [
        { s: '➡️', v: 'derecha', c: '#00ccff', t: 'texto' },
        { s: '⬅️', v: 'izquierda', c: '#00ccff', t: 'texto' },
        { s: '⬆️', v: 'adelante', c: '#00ccff', t: 'texto' },
        { s: '⬇️', v: 'atrás', c: '#00ccff', t: 'texto' },
        { s: '🔴', v: 'rojo', c: 'red', t: 'color' },
        { s: '🔵', v: 'azul', c: 'blue', t: 'color' },
        { s: '🟢', v: 'verde', c: 'green', t: 'color' },
        { s: '🟡', v: 'amarillo', c: 'yellow', t: 'color' },
        { s: '⏫', v: 'salta', c: 'white', t: 'texto' },
        { s: '⏬', v: 'agáchate', c: 'white', t: 'texto' },
        { s: '🙆', v: 'manos a la cabeza', c: 'white', t: 'texto' },
        { s: '🙌', v: 'manos en las rodillas', c: 'white', t: 'texto' }
    ];

    function generarPatron(pasos, reps, esp) {
        let f = [];
        for(let i=0; i<reps; i++) { pasos.forEach(p => f.push({ t: p.t + (i * esp), n: p.n })); }
        return f;
    }

    function mezclarArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
}
const mapas = {

    // 🔥 Patrón básico rápido (izq-der-arr-abj)
    'cancion1': { 
        archivo: 'cancion1.mp3.mp3', 
        pasos: generarPatron([
            {t:0.5, n:'IZQ'}, {t:1, n:'DER'}, 
            {t:1.5, n:'ARR'}, {t:2, n:'ABJ'}
        ], 12, 2.5)
    },

    // 🔥 Patrón cruzado (más desafiante)
    'cancion2': { 
        archivo: 'cancion2.mp3.mp3', 
        pasos: generarPatron([
            {t:0.5, n:'IZQ'}, {t:1, n:'ARR'}, 
            {t:1.5, n:'DER'}, {t:2, n:'ABJ'},
            {t:2.5, n:'ARR'}, {t:3, n:'IZQ'}
        ], 10, 3)
    },

    // 🔥 Patrón tipo “combo DDR” (rápido + memoria)
    'cancion3': { 
        archivo: 'cancion3.mp3.mp3', 
        pasos: generarPatron([
            {t:0.5, n:'IZQ'}, {t:0.9, n:'DER'},
            {t:1.3, n:'IZQ'}, {t:1.7, n:'ARR'},
            {t:2.1, n:'ABJ'}, {t:2.5, n:'DER'},
            {t:2.9, n:'ARR'}, {t:3.3, n:'IZQ'}
        ], 8, 3.5)
    }

};

    function mostrarPantalla(id){
        document.querySelectorAll('.pantalla').forEach(p=>p.classList.remove('activa'));
        document.getElementById(id).classList.add('activa');
    }

    function seleccionarCancion(id){
        modo = "coreo";
        const m = mapas[id];
        document.getElementById("music").src = m.archivo;
        tiempoInicioPatron = 0;
notasCoreoRestantes = m.pasos.map(p => ({ t: p.t, n: p.n }));
        document.getElementById("pista-ddr").style.display = "flex";
        document.getElementById("game-area").style.display = "none";
        document.getElementById("ctrl-velocidad-aleatorio").style.display = "none";
        mostrarPantalla('pantalla-juego');
    }

    function prepararAleatorio(){
        modo = "aleatorio";
        document.getElementById("music").src = "cancion aleatoria.mp3"; 
        document.getElementById("pista-ddr").style.display = "none";
        document.getElementById("game-area").style.display = "flex";
        document.getElementById("ctrl-velocidad-aleatorio").style.display = "flex";
        mostrarPantalla('pantalla-juego');
    }

   function hablar(t) {
    if(!vozActiva) return;

    window.speechSynthesis.cancel();
    const msg = new SpeechSynthesisUtterance(t);
    msg.lang = "es-MX";
    window.speechSynthesis.speak(msg);
}

    function toggleVoz(){
    vozActiva = !vozActiva;
    document.getElementById("btn-voz").innerText = 
        vozActiva ? "Quitar voz guía" : "Activar voz guía";
}
    function activarMotivacion() {
        const msg = document.createElement("div");
        msg.className = "mensaje-motivador";
        const texto = frasesMotivadoras[Math.floor(Math.random() * frasesMotivadoras.length)];
        msg.innerText = texto;
        msg.style.left = Math.random() > 0.5 ? "10%" : "70%";
        document.getElementById("pantalla-juego").appendChild(msg);
        hablar(texto);
        setTimeout(() => msg.remove(), 4000);
    }

    function ajustarManual(v) { ajusteManualVelocidad += v; if (intervalo) { clearInterval(intervalo); iniciarCiclo(); } }

    function startGame(){
        pararTodo();
        document.body.classList.add('fondo-juego-activo');
        document.getElementById("music").play();
        if(modo === "aleatorio") iniciarCiclo();
        else bucleCoreo();
    }

    function iniciarCiclo(){
        let ms = Math.max(600, 2800 + ajusteManualVelocidad);
        intervalo = setInterval(() => {
            if(mazoComandos.length === 0){
    mazoComandos = [...comandosAleatorios];
    mezclarArray(mazoComandos);
}
const paso = mazoComandos.pop();
            const area = document.getElementById("game-area");
            const div = document.createElement("div");
            div.className = "flecha-caida";
            div.style.setProperty('--duracion', (ms/1000) + 's');
            
            if(paso.t === 'color') {
                div.innerHTML = `<div class="circulo-color" style="background:${paso.c}"></div>`;
            } else {
                div.innerHTML = paso.s;
                div.style.color = paso.c;
            }
            area.appendChild(div);
            hablar(paso.v);
            setTimeout(() => div.remove(), ms);
        }, ms);
    }

    function bucleCoreo() {
    if (modo !== "coreo") return;

    const audio = document.getElementById("music");
    let cur = audio.currentTime;

    if (notasCoreoRestantes.length > 0 && cur >= tiempoInicioPatron + notasCoreoRestantes[0].t) {
        crearFlechaDDR(notasCoreoRestantes[0].n);
        notasCoreoRestantes.shift();
    }

    // 🔁 cuando se acaban, reinicia SOLO el patrón (no la canción)
    if (notasCoreoRestantes.length === 0) {
        const mapaActual = Object.values(mapas).find(m => m.archivo === audio.src.split('/').pop());
        if (mapaActual) {
            tiempoInicioPatron = cur;
            notasCoreoRestantes = mapaActual.pasos.map(p => ({ t: p.t, n: p.n }));
        }
    }

    rafCoreo = requestAnimationFrame(bucleCoreo);
}

    function crearFlechaDDR(dir) {
        const div = document.createElement("div");
        div.className = "flecha-nota";
        const config = { 'IZQ': {i:'⬅️', l:'10px'}, 'ARR': {i:'⬆️', l:'115px'}, 'ABJ': {i:'⬇️', l:'220px'}, 'DER': {i:'➡️', l:'325px'} };
        div.style.left = config[dir].l;
        div.innerHTML = config[dir].i;
        document.getElementById("notas-ddr").appendChild(div);
        const indexMap = { 'IZQ': 0, 'ARR': 1, 'ABJ': 2, 'DER': 3 };
const receptores = document.querySelectorAll(".receptor");
const receptor = receptores[indexMap[dir]];

if(receptor){
    receptor.classList.add("activo");
    setTimeout(() => receptor.classList.remove("activo"), 300);
}
        setTimeout(() => div.remove(), 3100);
    }

    function detenerJuego(){
        clearInterval(intervalo);
        cancelAnimationFrame(rafCoreo);
        document.getElementById("music").pause();
        window.speechSynthesis.cancel();
    }

    function pararTodo(){
        detenerJuego();
        document.getElementById("game-area").innerHTML = "";
        document.getElementById("notas-ddr").innerHTML = "";
    }

    function irAMenu(){ 
        pararTodo(); 
        document.body.classList.remove('fondo-juego-activo');
        mostrarPantalla('pantalla-menu'); 
    }
</script>
</body>
</html>
